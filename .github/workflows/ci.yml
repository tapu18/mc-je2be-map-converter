name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      include_quarantine:
        description: Run the isolated nightly tests too
        type: boolean
        default: false
  schedule:
    - cron: "23 18 * * *" # 03:23 JST

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check:
    name: check (型チェックとNodeのテスト)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: サーバーのダウンロードをキャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.cache/je2be
          key: servers-${{ hashFiles('tools/servers.json') }}
      # EULAへの同意はリポジトリの所有者が承認済み（CLAUDE.md 参照）
      - run: npm run setup:servers
      - run: npm run check
        env:
          JE2BE_REQUIRE_TEST_DATA: "1"

  plan:
    name: 実機テストの選択
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_jobs: ${{ steps.plan.outputs.has_jobs }}
    steps:
      - uses: actions/checkout@v4
        with:
          # PR のマージ結果を取得する。イベントの base SHA は別途取得する。
          fetch-depth: 2
      - name: PR の base SHA を取得
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            git fetch --no-tags --depth=1 origin "$PR_BASE_SHA" || echo "Base SHA の取得に失敗しました。差分が取得できなければ全テストを選択します。"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: plan
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          INCLUDE_QUARANTINE: ${{ inputs.include_quarantine }}
        run: node tools/server-test-plan.ts

  servers:
    name: servers / ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.has_jobs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ matrix.quarantine }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: サーバーのダウンロードをキャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.cache/je2be
          key: servers-${{ hashFiles('tools/servers.json') }}
      - name: 版別 Java のアーカイブをキャッシュ
        if: matrix.group == 'grammar'
        uses: actions/cache@v4
        with:
          path: ~/.cache/je2be-grammars
          key: java-grammars-${{ hashFiles('tools/java-grammars.json', 'tools/servers.json') }}
          restore-keys: java-grammars-
      # EULAへの同意はリポジトリの所有者が承認済み（CLAUDE.md 参照）
      - run: npm run setup:servers
      - name: 対応表の生成（bridge・runtime-load PoC）
        if: matrix.group == 'misc' || matrix.group == 'bridge'
        run: npm run setup:mappings
      - run: npm run build:pack
      - name: 実機テスト
        env:
          SERVER_TEST_FILES: ${{ toJSON(matrix.files) }}
          JE2BE_SCENARIO_IDS: ${{ matrix.group == 'scenarios' && toJSON(matrix.scenarios) || '' }}
          JE2BE_RETRY_REPORT: servers/test-retries.jsonl
        run: node tools/run-server-test-job.ts
      - name: ログと実測結果を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs-${{ matrix.name }}
          path: |
            servers/*.log
            servers/test-retries.jsonl
            poc/**/results*.json
          if-no-files-found: ignore

  result:
    name: servers / result
    needs: [plan, servers]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 選択された実機テストの結果
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          HAS_JOBS: ${{ needs.plan.outputs.has_jobs }}
          SERVERS_RESULT: ${{ needs.servers.result }}
        run: |
          if [[ "$PLAN_RESULT" != success ]]; then exit 1; fi
          if [[ "$HAS_JOBS" == true && "$SERVERS_RESULT" == success ]] || [[ "$HAS_JOBS" == false && "$SERVERS_RESULT" == skipped ]]; then exit 0; fi
          exit 1
